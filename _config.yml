# Site settings
title: Junseo Lee
email: junseo.lee.1@stonybrook.edu
description: "Exploring statistics, data science, and finance"
baseurl: ""                         # subpath, e.g. /blog
url: "https://www.junseolee.dev"      # base hostname & protocol
github_username: junseolee7
linkedin_username: pauljunseo
author: Junseo Lee

# Social / OG — image is used by jekyll-seo-tag for og:image and twitter:image.
image: /assets/images/profile.jpg
twitter:
  card: summary

# Build
timezone: Asia/Seoul
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown / math
markdown: kramdown
# Keep supporting Markdown documents available as files. Pages declare front matter.
optional_front_matter:
  enabled: false
kramdown:
  math_engine: mathjax
  math_engine_opts: {}
  input: GFM
  syntax_highlighter: rouge
  # Keep footnote backlinks as text glyphs on iOS.
  footnote_backlink: "&#8617;&#xFE0E;"

# Collections
collections:
  projects:
    output: false

# Files / folders Jekyll should ignore.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md
  - archived/
  - .obsidian/
  - .DS_Store

# Post defaults.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Junseo Lee"
