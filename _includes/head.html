<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preload" href="{{ '/design-system/assets/SourceSans3-VariableFont_wght.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ '/design-system/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/design-system/components.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  {%- feed_meta -%}

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/favicon.svg' | relative_url }}">

  {%- comment -%} Load MathJax only when a page or the site enables math. {%- endcomment -%}
  {%- if page.math or site.math_everywhere -%}
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {%- endif -%}

</head>
