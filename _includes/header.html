<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' or page.url == '/archive/' or page.layout == 'post' %} aria-current="page"{% endif %}>Writings</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/services/' | relative_url }}"{% if page.url contains '/services/' %} aria-current="page"{% endif %}>Services</a>
    </nav>
  </div>
</header>
