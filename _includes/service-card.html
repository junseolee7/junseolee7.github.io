{% assign s = include.service %}
<a href="{{ s.url | relative_url }}" class="project-entry">
  <div>
    <h3>{{ s.title | escape }}</h3>
    {% if s.summary %}<p>{{ s.summary | escape }}</p>{% endif %}
    {% if s.metadata %}
      <div class="tags">
        {% for item in s.metadata %}<span class="tag">{{ item | escape }}</span>{% endfor %}
      </div>
    {% endif %}
  </div>
  <span class="arrow" aria-hidden="true">→</span>
</a>
